name: Run Unit Tests

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-node:
    name: Install, Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - run: node --version
        name: Check Node Version 🔦
      - run: npm --version
        name: Check NPM Version 🩺
      - uses: actions/checkout@v4
        name: Checkout branch 🧺
      - run: npm ci
        name: Install NPM Packages 🔧
      - run: npm run lint
        name: Lint 🧹
      - run: npm run typecheck
        name: Type-check 🔍
      - run: npm test
        name: Run unit and parity tests 🧪
      - run: npm run build && npm run build:site
        name: Build bundles, types and demo site 📦
